<div class="profile-container">
  <app-header></app-header>

  <div class="content">
    <mat-card class="profile-card">
      <mat-card-header>
        <mat-card-title>Profile Settings</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
          
          <!-- Data Source Selection -->
          <div class="data-source-section">
            <h3>Data Source</h3>
            <div class="source-selector">
              <button mat-stroked-button 
                      type="button"
                      [class.selected]="selectedDataSource === 'csv'"
                      (click)="selectDataSource('csv')"
                      class="source-btn">
                <mat-icon>insert_drive_file</mat-icon>
                <span>CSV Upload</span>
              </button>
              <button mat-stroked-button 
                      type="button"
                      [class.selected]="selectedDataSource === 'clockify'"
                      (click)="selectDataSource('clockify')"
                      class="source-btn">
                <mat-icon>cloud</mat-icon>
                <span>Clockify</span>
              </button>
            </div>
          </div>

          <!-- Clockify API Key (sadece Clockify seçildiğinde) -->
          <ng-container *ngIf="selectedDataSource === 'clockify'">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Clockify API Key</mat-label>
              <input matInput [type]="hideApiKey ? 'password' : 'text'" formControlName="clockify_api_key" placeholder="Enter your Clockify API key">
              <mat-icon matPrefix>vpn_key</mat-icon>
              <button mat-icon-button matSuffix (click)="hideApiKey = !hideApiKey" type="button" tabindex="-1">
                <mat-icon>{{hideApiKey ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
              <mat-hint>Find your API key in Clockify settings. Leave empty to keep current key.</mat-hint>
            </mat-form-field>
          </ng-container>

          <!-- Profile Fields -->
          <ng-container *ngIf="user?.user_type === 'individual'">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Full Name</mat-label>
              <input matInput formControlName="full_name" required>
              <mat-icon matPrefix>person</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Phone</mat-label>
              <input matInput formControlName="phone">
              <mat-icon matPrefix>phone</mat-icon>
            </mat-form-field>
          </ng-container>

          <ng-container *ngIf="user?.user_type === 'company'">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Company Name</mat-label>
              <input matInput formControlName="company_name" required>
              <mat-icon matPrefix>business</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Contact Person</mat-label>
              <input matInput formControlName="contact_person">
              <mat-icon matPrefix>person</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Phone</mat-label>
              <input matInput formControlName="phone">
              <mat-icon matPrefix>phone</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Address</mat-label>
              <textarea matInput formControlName="address" rows="3"></textarea>
              <mat-icon matPrefix>location_on</mat-icon>
            </mat-form-field>

            <div class="logo-section">
              <h3>Company Logo</h3>
              <img *ngIf="logoPreview" [src]="logoPreview" alt="Logo" class="logo-preview">
              <input type="file" accept="image/*" (change)="onFileSelected($event)" #fileInput hidden>
              <button mat-raised-button type="button" (click)="fileInput.click()">
                <mat-icon>upload</mat-icon>
                {{ logoPreview ? 'Change Logo' : 'Upload Logo' }}
              </button>
            </div>
          </ng-container>

          <button mat-raised-button color="primary" type="submit" [disabled]="loading || profileForm.invalid">
            <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
            <span *ngIf="!loading">Save Changes</span>
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
